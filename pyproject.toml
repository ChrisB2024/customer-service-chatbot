[project]
name = "chatbot"
version = "0.1.0"
description = "RAG customer-support chatbot for a fictional store (Nimbus Gear)"
readme = "README.md"
authors = [
    { name = "Chris Bouda", email = "christopherbouda936@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastembed>=0.8.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.4",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real embedding model (downloaded on first run)"]
filterwarnings = [
    # chromadb warns about langchain-chroma's collection config; not actionable here
    "ignore:legacy embedding function config:DeprecationWarning",
]

[tool.ruff]
line-length = 120
